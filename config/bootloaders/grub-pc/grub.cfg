source /boot/grub/config.cfg

set timeout=10

menuentry "@ORKA_NAME@ @ORKA_VERSION@ (English)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "@ORKA_NAME@ @ORKA_VERSION@ (Polski)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=pl_PL.UTF-8 keyboard-layouts=pl
	initrd	@INITRD_LIVE@
}

menuentry "@ORKA_NAME@ @ORKA_VERSION@ (text boot / tryb tekstowy)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ plymouth.enable=0 systemd.show_status=1
	initrd	@INITRD_LIVE@
}

menuentry "@ORKA_NAME@ @ORKA_VERSION@ (safe graphics - nomodeset)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

if @ENABLE_MEMTEST@; then
	source /boot/grub/memtest.cfg
fi

if @ENABLE_VERIFY_CHECKSUMS@; then
	menuentry "Verify integrity of the boot medium" {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
fi

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" {
		fwsetup
	}
fi

menuentry "System shutdown" {
	halt
}

menuentry "System restart" {
	reboot
}
