
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

initial_window_width  132c
initial_window_height 36c
remember_window_size  no
window_padding_width  12
confirm_os_window_close 0

background_opacity 0.84
background_blur 32
dynamic_background_opacity yes

cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

scrollback_lines 10000
url_style curly
detect_urls yes

enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #2a2f55

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_foreground   #ffffff
active_tab_background   #4f58f0
active_tab_font_style   bold
inactive_tab_foreground #a0a6c4
inactive_tab_background #1b1e36
tab_bar_background      #0f1120

foreground           #eceefa
background           #0f1120
selection_foreground #ffffff
selection_background #4f58f0
cursor               #6c78ff
cursor_text_color    #0f1120
url_color            #18b4e0

color0  #1b1e36
color8  #4a5080
color1  #ff5c7a
color9  #ff8098
color2  #3ddc97
color10 #6ff0b5
color3  #ffc857
color11 #ffd98a
color4  #6c78ff
color12 #939cff
color5  #b06bff
color13 #c99bff
color6  #18b4e0
color14 #5fd3f3
color7  #c4c8e2
color15 #ffffff
