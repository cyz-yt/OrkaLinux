add_newline = true
format = "$username$hostname$directory$git_branch$git_status$python$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #b06bff"
style_root = "bold #ff5c7a"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#a0a6c4"
format = "[@$hostname]($style) "

[directory]
style = "bold #18b4e0"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "⎇ "
style = "bold #ff7ab6"
format = "[$symbol$branch]($style) "

[git_status]
style = "#ffc857"

[python]
format = "[py $version]($style) "
style = "#3ddc97"

[cmd_duration]
min_time = 2000
style = "#a0a6c4"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #6c78ff)"
error_symbol = "[❯](bold #ff5c7a)"
